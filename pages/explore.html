<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Explora las propuestas de la comunidad SDADI. Busca, filtra y apoya iniciativas ciudadanas y tecnológicas.">
  <title>Explorar propuestas — SDADI Community</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/global.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/responsive.css">
</head>
<body data-page="explore">
  <a class="skip-link" href="#contenido">Saltar al contenido</a>
  <header id="site-header"></header>
  <main id="contenido" class="section-shell page-hero explore-page">
    <div class="explore-intro">
      <div>
        <span class="section-kicker">Explora</span>
        <h1>Propuestas que buscan avanzar.</h1>
        <p>Descubre ideas de la comunidad, encuentra una perspectiva que te inspire y acompaña su siguiente paso.</p>
      </div>
      <span class="demo-badge">Propuestas de la comunidad</span>
    </div>

    <section class="explore-toolbar" aria-label="Buscar y filtrar propuestas">
      <label class="search-field">
        <span aria-hidden="true">⌕</span>
        <input id="proposal-search" type="search" placeholder="Buscar por título, descripción o categoría" aria-label="Buscar propuestas">
      </label>
      <label>
        <span class="sr-only">Categoría</span>
        <select id="category-filter">
          <option value="all">Todas las categorías</option>
          <option>Tecnología</option>
          <option>Educación</option>
          <option>Medioambiente</option>
          <option>Comunidad</option>
          <option>Salud y bienestar</option>
          <option>Ciencia</option>
          <option>Software</option>
          <option>Diseño</option>
          <option>Innovación</option>
          <option>Otros</option>
        </select>
      </label>
      <label>
        <span class="sr-only">Estado</span>
        <select id="status-filter">
          <option value="all">Todos los estados</option>
          <option>Nueva</option>
          <option>En evaluación</option>
          <option>Aprobada</option>
          <option>En desarrollo</option>
          <option>Completada</option>
          <option>Archivada</option>
        </select>
      </label>
      <label>
        <span class="sr-only">Ordenar</span>
        <select id="sort-filter">
          <option value="recent">Más recientes</option>
          <option value="popular">Más apoyadas</option>
          <option value="comments">Más comentadas</option>
        </select>
      </label>
    </section>

    <div class="results-heading">
      <strong id="result-count">Cargando propuestas…</strong>
      <a class="button button-primary" href="submit.html">Publicar una idea →</a>
    </div>

    <section id="explore-grid" class="proposal-grid" aria-live="polite" aria-busy="true"></section>
    <div class="load-more-wrap"><button class="button button-secondary" type="button" id="load-more" hidden>Cargar más propuestas</button></div>
  </main>
  <footer id="site-footer"></footer>
  <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
  <script src="../assets/js/navigation.js"></script>
  <script src="../assets/js/notifications.js"></script>
  <script src="../config/supabase.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="../assets/js/supabase.js"></script>
  <script src="../assets/js/core.js"></script>
  <script src="../assets/js/session.js"></script>
  <script src="../assets/js/explore.js"></script>
</body>
</html>
