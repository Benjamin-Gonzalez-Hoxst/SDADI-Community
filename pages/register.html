<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Regístrate en SDADI Community para compartir tus propuestas y conectar con innovadores.">
  <title>Registrarse — SDADI Community</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/global.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/responsive.css">
</head>
<body data-page="register">
  <a class="skip-link" href="#contenido">Saltar al contenido</a>
  <header id="site-header"></header>

  <main id="contenido" class="section-shell auth-page">
    <div class="auth-card">
      <span class="section-kicker">Únete</span>
      <h1>Tu perspectiva puede impulsar un proyecto.</h1>
      <p>Crea una cuenta para compartir ideas y colaborar con la comunidad.</p>

      <form id="register-form" class="auth-form">
        <label for="display_name">Nombre visible</label>
        <input id="display_name" name="display_name" type="text" autocomplete="name" minlength="1" maxlength="80" required>

        <label for="username">Nombre de usuario</label>
        <input id="username" name="username" type="text" autocomplete="username" pattern="[A-Za-z0-9_]{3,30}" title="Usa entre 3 y 30 letras, números o guiones bajos" required>

        <label for="email">Correo electrónico</label>
        <input id="email" name="email" type="email" autocomplete="email" required>

        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>

        <button class="button button-primary" type="submit">Crear cuenta →</button>
        <div id="auth-message" class="auth-message" hidden role="status" aria-live="polite"></div>
      </form>

      <p class="auth-switch">¿Ya tienes una cuenta? <a href="login.html">Inicia sesión</a>.</p>
    </div>
  </main>

  <footer id="site-footer"></footer>
  <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>

  <script src="../assets/js/navigation.js"></script>
  <script src="../assets/js/notifications.js"></script>
  <script src="../config/supabase.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.2/dist/umd/supabase.min.js" integrity="sha384-7i/4BYWz4Mn+lJfg2HWfEPfZQ7tmFKF3CTSKlXBpxWjNlLjcg+T6smpHG4gLmU1u" crossorigin="anonymous"></script>
  <script src="../assets/js/supabase.js"></script>
  <script src="../assets/js/auth.js"></script>
</body>
</html>
